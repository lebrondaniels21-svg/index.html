/* =====================================================
   NO-REPEAT SYSTEM
   ===================================================== */

let usedResponses = new Set();


function normalize(text) {

    return text

        .toLowerCase()

        .replace(/[^\w\s]/g, "")

        .replace(/\s+/g, " ")

        .trim();

}



function chooseUnique(array) {

    if (!array || array.length === 0) {

        return "";

    }


    let available =
        array.filter(item =>
            !usedResponses.has(normalize(item))
        );


    /*
       If every item in this category has been used,
       reset ONLY that category.

       This means Mysterio can continue functioning
       instead of becoming useless after enough questions.
    */

    if (available.length === 0) {

        array.forEach(item => {

            usedResponses.delete(
                normalize(item)
            );

        });


        available = [...array];

    }


    const selected =
        available[
            Math.floor(
                Math.random() * available.length
            )
        ];


    usedResponses.add(
        normalize(selected)
    );


    return selected;

}



/* =====================================================

   ===================================================== */

function detectQuestionType(question) {

    const q =
        question.toLowerCase().trim();

    if (

        q.includes("death") ||

        q.includes("when will i die") ||

    ) {

        return "lifeDeath";

    */

    if (

        q.startsWith("will ") ||

        q.startsWith("can ") ||

        q.startsWith("is ") ||

        q.startsWith("are ") ||

        q.startsWith("do ") ||

        q.startsWith("does ") ||

        q.startsWith("did ") ||

        q.startsWith("has ") ||

        q.startsWith("have ")

    ) {

        return "yesno";

    }


    /*
       DECISIONS
    */

    if (

        q.includes("should i") ||

        q.includes("should we") ||

        q.includes("should i ")

    ) {

        return "decision";

    }


    /*
       WHY
    */

    if (

        q.startsWith("why ")

    ) {

        return "explanation";

    }


    /*
       WHAT / WHEN / WHERE / WHO
    */

    if (

        q.startsWith("what ") ||

        q.startsWith("when ") ||

        q.startsWith("where ") ||

        q.startsWith("who ") ||

        q.startsWith("how ")

    ) {

        return "future";

    }


    return "general";

}

    }


    /*
       DIRECT YES / NO
    */

    let directAnswer;


    if (type === "yesno") {

        const answerGroups = [

            answers.yes,

            answers.no,

            answers.maybe,

            answers.notYet,

            answers.unlikely

        ];

            answerGroups[

                    answerGroups.length

            ];


        directAnswer =
            chooseUnique(selectedGroup);

    /*
       DECISION QUESTIONS
    */

        const decisions = [

            "WAIT BEFORE DECIDING.",

            "GATHER MORE INFORMATION FIRST.",

        directAnswer =

    /*
       OTHER QUESTIONS
    */

    else {

        const generalAnswers = [

            "The crystal reveals several possible paths.",

            "The answer is still forming.",

            "The future around this question remains open.",

            "The crystal detects an uncertain but interesting path.",

            "The answer is connected to something that has not happened yet.",

            "The signs reveal possibility rather than certainty."

        ];


        directAnswer =
            chooseUnique(generalAnswers);

    }



    const opening =
        chooseUnique(openings);


    const topicPool =
        topics[topic] || topics.random;


    const explanation =
        chooseUnique(topicPool);


    const detail =
        chooseUnique(details);



    let response =

        opening +

        "\n\n" +

        directAnswer +

        "\n\n" +

        explanation +

        "\n\n" +

        detail;



    /*
       PERSONALIZATION
    */

    if (name) {

        response =

            name +

            response.charAt(0).toLowerCase() +

            response.slice(1);

    }



    /*
       ADD ZODIAC READING
    */

    if (zodiac) {

        response +=

       OCCASIONAL ASTRONOMY FACT

        zodiac &&

        Math.random() < 0.35

        response +=

    }



    return response;

}

            .value

            .trim();


    const zodiac =

        document

            .getElementById("zodiac")

            .value;


    const question =

        document

            .getElementById("question")

            .value

            .trim();


    const fortuneBox =

        document

            .getElementById("fortune");


    const detected =

        document

            .getElementById("detected");



    if (!question) {

        fortuneBox.textContent =

            "🔮 Ask Mysterio a question first.";

        detected.textContent = "";

        return;

    }



    fortuneBox.textContent =

        "🔮 Mysterio is reading the crystal ball...";


    detected.textContent = "";



    setTimeout(() => {


        const response =

            buildResponse(

                question,

                name,

                zodiac

            );


        fortuneBox.textContent =
            response;



        detected.textContent =

            "Question type: " +

            detectQuestionType(

                question

            ).toUpperCase() +

            "  |  Topic: " +

            detectTopic(

                question

            ).toUpperCase();



    }, 900);

}



/* =====================================================
   ENTER KEY
   ===================================================== */

document

    .getElementById("question")

    .addEventListener(

        "keydown",

        function(event) {

            if (event.key === "Enter") {

                revealFortune();

            }

        }

    );

</script>


</body>
